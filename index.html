<!-- ============ APP LAYOUT ============ -->
<div class="app">
  <div class="scrim" id="scrim" onclick="toggleSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-badge"><svg class="icon"><use href="#i-camera"/></svg></div>
      <div>
        <div class="logo-name">Studio <span>Manager</span></div>
        <div class="logo-sub" id="sideStudioName">Studio chụp ảnh</div>
      </div>
    </div>

    <nav class="nav" id="navRoot"></nav>

    <div class="sidebar-foot">
      <div class="avatar" id="sideAvatarTxt">?</div>
      <div class="foot-info">
        <div class="foot-name" id="sideUserName">—</div>
        <div class="foot-sub" id="sideUserRole">—</div>
      </div>
      <button class="icon-btn" id="btnLogout" title="Đăng xuất" onclick="logout()"><svg class="icon"><use href="#i-logout"/></svg></button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" onclick="toggleSidebar()"><svg class="icon"><use href="#i-menu"/></svg></button>
      <div class="page-title">
        <h1 id="pageTitle">Tổng quan</h1>
        <p id="pageSub"></p>
      </div>
      <div class="topbar-right">
        <span id="attWidget"></span>
        <select class="select" id="branchSel" style="width:auto;font-size:12.5px;padding:7px 30px 7px 11px" onchange="setBranch(this.value)" title="Lọc dữ liệu theo chi nhánh"></select>
        <span class="today-badge" id="todayBadge"></span>
      </div>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>

<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-badge"><svg class="icon"><use href="#i-camera"/></svg></div>
      <div class="auth-title" id="authStudioName">Studio Manager</div>
      <div class="auth-sub-title">Hệ thống quản lý studio chụp ảnh</div>
    </div>
    <div id="authBox"></div>
  </div>
</div>

<div class="auth-screen" id="pwdScreen" style="z-index:310">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-badge"><svg class="icon"><use href="#i-lock"/></svg></div>
      <div class="auth-title">Đổi mật khẩu bắt buộc</div>
      <div class="auth-sub-title">Bảo mật tài khoản của bạn</div>
    </div>
    <p class="auth-sub">Tài khoản <b id="pwdUser"></b> đang dùng mật khẩu do quản trị viên cấp. Hãy đặt mật khẩu riêng của bạn để tiếp tục.</p>
    <div class="auth-error" id="cpError" style="display:none"></div>
    <form onsubmit="submitChangePwd();return false;">
      <div class="field"><label>Mật khẩu mới</label><input class="input" type="password" id="cpPass" required autocomplete="new-password" placeholder="Tối thiểu 4 ký tự"></div>
      <div class="field"><label>Nhập lại mật khẩu mới</label><input class="input" type="password" id="cpPass2" required autocomplete="new-password"></div>
      <button class="btn btn-primary btn-block" type="submit"><svg class="icon"><use href="#i-check"/></svg> Đặt mật khẩu &amp; tiếp tục</button>
    </form>
  </div>
</div>

<div class="portal-screen" id="portalScreen"><div id="portalBody"></div></div>

<div class="modal-backdrop" id="modalRoot"></div>
<div class="toast-wrap" id="toastRoot"></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="doImport(this)">
<input type="file" id="csvFile" accept=".csv,.txt,text/csv" style="display:none" onchange="doImportCsv(this)">

<script src="js/app.js?v=9"></script>
</body>
</html>
